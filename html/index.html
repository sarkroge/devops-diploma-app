<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дипломный проект — Егор Краснов</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: #142238; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 740px; margin: 10vh auto; padding: 40px; background: white; border-radius: 20px; }
    .label { color: #475569; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; margin: 14px 0 24px; }
    .status { display: inline-block; background: #dcfce7; color: #166534; padding: 5px 14px; border-radius: 20px; }
    footer { border-top: 1px solid #e2e8f0; margin-top: 32px; padding-top: 20px; color: #475569; font-size: 14px; }
    @media (max-width: 760px) { main { margin: 24px 16px; padding: 28px; } }
  </style>
</head>
<body>
  <main>
    <div class="label">Нетология · DevOps</div>
    <h1>Дипломный проект<br>Егора Краснова</h1>
    <p class="status">Приложение работает</p>
    <p>Тестовое приложение на nginx для проверки сборки контейнера и развёртывания в Kubernetes.</p>
    <p>Версия приложения: <strong id="version">загрузка…</strong></p>
    <footer>Yandex Cloud · Terraform · Ansible · Kubernetes · GitHub Actions</footer>
  </main>
  <script>
    fetch('/version.json', { cache: 'no-store' })
      .then(response => { if (!response.ok) throw new Error('Version unavailable'); return response.json(); })
      .then(data => { document.getElementById('version').textContent = data.version; })
      .catch(() => { document.getElementById('version').textContent = 'недоступна'; });
  </script>
</body>
</html>
